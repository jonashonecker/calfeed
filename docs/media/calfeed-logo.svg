<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="calfeed">
  <title>calfeed</title>
  <style>
    svg { --ink: #4F545A; --accent: #F1A158; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #ECEDEF; --accent: #F4AC66; }
    }
  </style>

  <!-- Binding tabs -->
  <rect x="86"  y="32" width="16" height="36" rx="8" fill="var(--ink)"/>
  <rect x="154" y="32" width="16" height="36" rx="8" fill="var(--ink)"/>

  <!-- Calendar outline frame -->
  <rect x="40" y="54" width="176" height="162" rx="26"
        fill="none" stroke="var(--ink)" stroke-width="14"/>

  <!-- Header divider -->
  <line x1="47" y1="96" x2="209" y2="96" stroke="var(--ink)" stroke-width="13"/>

  <!-- Feed (RSS) mark in the calendar body -->
  <g fill="none" stroke="var(--accent)" stroke-width="16" stroke-linecap="round">
    <path d="M96 154 a34 34 0 0 1 34 34"/>
    <path d="M96 124 a64 64 0 0 1 64 64"/>
  </g>
  <circle cx="97" cy="187" r="12" fill="var(--accent)"/>
</svg>
