name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  format:
    name: Prettier check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dev dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  blackbox:
    name: Blackbox API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Hurl
        run: |
          VERSION=6.1.1
          curl -sL "https://github.com/Orange-OpenSource/hurl/releases/download/${VERSION}/hurl-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o hurl.tar.gz
          tar xzf hurl.tar.gz
          echo "$PWD/hurl-${VERSION}-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"

      - name: Run blackbox test suite
        run: ./test/run.sh
