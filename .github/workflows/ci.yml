name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  blackbox:
    name: Blackbox API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Hurl
        run: |
          VERSION=6.1.1
          curl -sL "https://github.com/Orange-OpenSource/hurl/releases/download/${VERSION}/hurl-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o hurl.tar.gz
          tar xzf hurl.tar.gz
          echo "$PWD/hurl-${VERSION}-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"

      - name: Run blackbox test suite
        run: ./test/run.sh

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t calfeed:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name calfeed \
            -e CALFEED_ADMIN_TOKEN=ci-token \
            -e CALFEED_BASE_URL=http://localhost:8787 \
            -p 8787:8787 calfeed:ci
          # Wait for readiness.
          for _ in $(seq 1 50); do
            curl -s -o /dev/null http://localhost:8787/cal/probe.ics && break
            sleep 0.2
          done
          # Create a calendar and confirm the feed answers.
          CAL=$(curl -s -X POST http://localhost:8787/calendars \
            -H "Authorization: Bearer ci-token" \
            -H "Content-Type: application/json" \
            -d '{"name":"CI"}')
          echo "$CAL"
          echo "$CAL" | grep -q subscribe_url
          docker rm -f calfeed
