services:
  calfeed:
    build: .
    ports:
      - '8787:8787'
    environment:
      # Required: a strong administrator token, from a .env file or your shell.
      # Compose refuses to start without it, instead of crash-looping the server.
      CALFEED_ADMIN_TOKEN: ${CALFEED_ADMIN_TOKEN:?set CALFEED_ADMIN_TOKEN to a strong secret}
      # Public base URL used in subscribe_url / webcal_url.
      CALFEED_BASE_URL: ${CALFEED_BASE_URL:-http://localhost:8787}
      PORT: 8787
    volumes:
      # SQLite database persists across restarts in a named volume.
      - calfeed-data:/data
    restart: unless-stopped

volumes:
  calfeed-data:
