StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = calfeed

Packages = Google

[*.md]
BasedOnStyles = Vale, Google

# Vale also lints the comments in JavaScript source files. Three rules are
# off here because code comments quote identifiers and constants verbatim:
# case preferences, acronym expansion, and the no-parentheses guidance don't
# fit next to code.
[*.js]
BasedOnStyles = Vale, Google
Vale.Terms = NO
Google.Acronyms = NO
Google.Parens = NO
Google.WordList = NO
